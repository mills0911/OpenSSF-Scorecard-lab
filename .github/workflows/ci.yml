name: C++ build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Compile with strict warnings
        run: cmake --build build --parallel 2
      - name: Run automated tests
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Analyze production C++ source with Clang Static Analyzer
        run: python3 scripts/run_static_analysis.py

  sanitized-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Clang with address and undefined-behavior sanitizers
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_SANITIZERS=ON
      - name: Compile sanitizer-instrumented targets
        run: cmake --build build-sanitized --parallel 2
      - name: Run automated tests with sanitizer checks
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitized --output-on-failure
